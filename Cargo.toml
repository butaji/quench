[workspace]
resolver = "2"
members = [
    "quench-bench",
    "crates/quench-js-check",
    "crates/quench-node",
    "crates/quench-node-test",
    "crates/quench-runtime",
    "crates/quench-runtime-next",
    "crates/quench-regexp",
    "crates/quench-test262",
    "crates/quench-wasm",
    "crates/quench-wasm-test",
]

[profile.dev]
# Minimize compiler work for the default edit/compile cycle. Use `iteration`
# when executing binaries matters more than compile latency.
opt-level = 0
debug = 0
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.test]
opt-level = 0
debug = 0
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-thin]
inherits = "release"
lto = "thin"

# Fast optimized execution for iterative conformance work, without whole-
# program LTO invalidating the incremental build graph after each runtime edit.
# The final release profile remains the production/performance authority.
[profile.iteration]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true

[profile.production]
inherits = "release"
# Alias the release contract for explicit score invocations. The optimizer
# policy itself lives only in `profile.release`.

[profile.bench-throughput]
inherits = "production"
debug = 0
strip = "symbols"

# Optimized measurements with full address-to-source attribution. DWARF makes
# samples explainable; operation counts still come from explicit counters.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
