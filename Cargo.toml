[workspace]
resolver = "2"
members = [
    "quench-bench",
    "crates/quench-js-check",
    "crates/quench-node",
    "crates/quench-node-test",
    "crates/quench-runtime",
    "crates/quench-test262",
]

[profile.dev]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-thin]
inherits = "release"
lto = "thin"

[profile.production]
inherits = "release"
# Production artifacts use whole-program optimization and one codegen unit.
# Keep this profile explicit so release policy cannot drift by accident.
lto = "fat"
codegen-units = 1
