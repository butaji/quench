[workspace]
resolver = "2"
# The vendored oxc crates are patches ([patch.crates-io]), not members: as members their
# dev-dependencies (oxc_ast "serialize") would join `--workspace` feature resolution and
# rebuild the oxc, regexp and runtime graph under a second feature set.
exclude = ["vendor/oxc-parser", "vendor/oxc-regular-expression", "vendor/iana-time-zone"]
members = [
    "quench-bench",
    "crates/quench-js-check",
    "crates/quench-lint",
    "crates/quench-macros",
    "crates/quench-node",
    "crates/quench-node-test",
    "crates/quench-runtime",
    "crates/quench-stack",
    "crates/quench-alloc",
    "crates/quench-regexp",
    "crates/quench-intl",
    "crates/quench-temporal",
    "crates/quench-test262",
    "crates/quench-wasm",
    "crates/quench-wasm-test",
]

# Function arity and type size are not review caps here; every other clippy lint stays at
# its default level, plus the redundancy rules below (AGENTS.md "Check once", "One fact, one
# authoritative representation"): no second lookup, copy or eagerly built value where one
# suffices. `quench-lint` enforces the same law for duplicated functions and constants.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
assigning_clones = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
set_contains_or_insert = "warn"

[workspace.dependencies]
oxc = "=0.153.0"
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_ast_visit = "=0.153.0"
oxc_diagnostics = "=0.153.0"
oxc_parser = { version = "=0.153.0", default-features = false }
oxc_regular_expression = "=0.153.0"
oxc_semantic = "=0.153.0"
oxc_span = "=0.153.0"
oxc_syntax = "=0.153.0"

[profile.dev]
# Minimize compiler work for the default edit/compile cycle. Use `iteration`
# when executing binaries matters more than compile latency.
opt-level = 0
debug = 0
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Fast optimized execution for iterative conformance work, without whole-
# program LTO invalidating the incremental build graph after each runtime edit.
# The final release profile remains the production/performance authority.
# This is the edit/measure loop: on the M4 host a quench-node edit rebuilds in
# ~2 s against ~2 m 35 s for `production`, which stays non-incremental because
# it is the qualified artifact.
[profile.iteration]
inherits = "release"
# Share dependency artifacts between iterative binaries and Rust API tests,
# which require unwinding. Production/release retain abort-on-panic.
panic = "unwind"
opt-level = 1
lto = false
codegen-units = 256
incremental = true

[profile.production]
inherits = "release"
# Keep qualification builds independent of user-level profile overrides. On
# the M4 qualification host, thin LTO won the matched local-loop cycle runs
# and the one-round V8-v7 Score screen. Fat LTO used fewer instructions and
# less RSS but more cycles. This is an M4 policy choice, not a universal claim.
opt-level = 3
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false
# The symbol table stays: a trained link order names symbols, whose crate
# hashes follow the profile (crates/quench-wasm-test/build.rs). It is not
# loaded at run time.
strip = "debuginfo"
panic = "abort"
lto = "thin"
codegen-units = 1
rpath = false

# Optimized A/B loop for JIT and runtime experiments: full optimization without
# LTO, incremental, and line tables so callgrind/perf can name the cost. JIT-emitted
# code is independent of host LTO; relative deltas measured here pick candidates,
# and only a final candidate is rebuilt and measured under `production`.
[profile.experiment]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"
strip = "none"

# Native SDK consumers link optimized machine-code archive members directly.
# This keeps whole-image LLVM optimization out of repeated SDK consumer links.
[profile.native-support]
inherits = "production"
lto = false

# Optimized measurements with full address-to-source attribution. DWARF makes
# samples explainable; operation counts still come from explicit counters.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[patch.crates-io]
iana-time-zone = { path = "vendor/iana-time-zone" }
oxc_parser = { path = "vendor/oxc-parser" }
oxc_regular_expression = { path = "vendor/oxc-regular-expression" }
cranelift-codegen = { path = "vendor/cranelift-codegen" }
