[build]
# Enforce clippy rules from .clippy.toml — never allow warnings.
# 64-byte function alignment measured +3.4% on Linux CoreMark (Linear TOD-19).
rustflags = ["-D", "warnings", "-C", "llvm-args=-align-all-functions=6"]

# Use LLVM's target alignment on Apple ARM; the forced alignment above is a
# Linux measurement. Host-specific qualification and code residency: Linear TOD-8.
[target.aarch64-apple-darwin]
rustflags = ["-D", "warnings"]

# x86-64 Linux links OpenSSL statically: the shared libssl/libcrypto pair costs
# about 1 MiB of resident set in every process at load (relocations and
# fault-around), crypto used or not, while archive members cost nothing until
# called. openssl-sys reads these target-prefixed names only for this target, and
# a variable set in the environment takes precedence.
[env]
# quench-runtime's lane handlers use the `rust-preserve-none` calling convention
# (`#![feature(rust_preserve_none_cc)]`), which the pinned toolchain gates as unstable.
RUSTC_BOOTSTRAP = "1"
X86_64_UNKNOWN_LINUX_GNU_OPENSSL_STATIC = "1"
X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR = "/usr/lib/x86_64-linux-gnu"
X86_64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR = "/usr/include"
# The system libcrypto archive includes zlib compression support. Declare its
# archive dependency explicitly so static OpenSSL links resolve those symbols.
X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIBS = "ssl:crypto:z"
