[build]
# Enforce clippy rules from .clippy.toml — never allow warnings.
rustflags = ["-D", "warnings"]

[profile.dev]
opt-level = 0
debug = 0
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.test]
opt-level = 0
debug = 0
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
