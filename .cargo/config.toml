[build]
# Enforce clippy rules from .clippy.toml — never allow warnings.
# Functions start on 64-byte boundaries: each small fast-lane handler then
# owns its cache line and decoded-instruction window, which measured +3-4%
# on CoreMark (Linux x86_64 cloud host; 32-byte alignment measured no gain).
rustflags = ["-D", "warnings", "-C", "llvm-args=-align-all-functions=6"]

# Target rustflags replace build.rustflags. Keep the warning policy and the
# function alignment active on the M4 qualification target. The host-specific
# deployment argument remains supplied by its target configuration.
[target.aarch64-apple-darwin]
rustflags = ["-D", "warnings", "-C", "llvm-args=-align-all-functions=6"]
