[package]
name = "quench-runtime-next"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Pinned v2-derived interpreter snapshot for the Quench rewrite"

[lib]
name = "rqj"

[[bin]]
name = "quench-next"
path = "src/bin/quench-next.rs"

[features]
default = []
profile-aggregate = []
profile-trace = ["profile-aggregate"]
profile-memory = []
reference = []

[dependencies]
oxc_allocator = "=0.150.0"
oxc_ast = "=0.150.0"
oxc_parser = { version = "=0.150.0", default-features = false }
oxc_span = "=0.150.0"
rustc-hash = "2.1"
regex = "1.11"
serde_json = "1"

[dev-dependencies]
