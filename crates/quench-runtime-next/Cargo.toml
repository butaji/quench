[package]
name = "quench-runtime-next"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Pinned v2-derived interpreter snapshot for the Quench rewrite"

[lib]
name = "rqj"

[[bin]]
name = "quench-next"
path = "src/bin/quench-next.rs"

[features]
default = []
profile-aggregate = []
profile-trace = ["profile-aggregate"]
profile-memory = []
reference = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
oxc_allocator = "=0.150.0"
oxc_ast = "=0.150.0"
oxc_ast_visit = "=0.150.0"
oxc_parser = { version = "=0.150.0", default-features = false }
oxc_semantic = "=0.150.0"
oxc_span = "=0.150.0"
oxc_syntax = "=0.150.0"
rustc-hash = "2.1"
num-bigint = "0.4"
regex = "1.11"
quench-regexp = { path = "../quench-regexp" }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
