[package]
name = "quench-node-test"
version = "0.1.0"
edition = "2021"
description = "Node.js test runner for a Node-API compatibility host"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2.1"
quench-node = { path = "../quench-node" }
quench-runtime = { path = "../quench-runtime" }
