[package]
name = "quench-runtime"
version = "0.1.0"
edition = "2021"
description = "Residual VM kernel for the Quench program reducer"
license = "MIT"

[features]
execution-trace = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libc = "0.2"
chrono-tz = "0.10"
icu_collator = { version = "2.3", features = ["compiled_data"] }
icu_calendar = { version = "2.3", features = ["compiled_data"] }
icu_casemap = { version = "2.2", features = ["compiled_data"] }
icu_locale_core = "2.3"
icu_provider = "2.3"
icu_properties = { version = "2.3", features = ["compiled_data"] }
num-bigint = "0.4"
rug = { version = "1.30", default-features = false, features = ["integer", "std"] }
oxc = { version = "0.47", features = ["semantic"] }
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl"] }
stacker = "0.1"
serde_json = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
wasmparser = "0.247"

[build-dependencies]
object = "0.39.1"
