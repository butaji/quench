[package]
name = "quench-runtime"
version = "0.1.0"
edition = "2021"
description = "Residual VM kernel for the Quench program reducer"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
num-bigint = "0.4"
oxc = { version = "0.47", features = ["semantic"] }
regress = "0.10"
serde_json = "1"
unicode-normalization = "0.1"
