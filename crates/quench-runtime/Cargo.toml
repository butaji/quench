[package]
name = "quench-runtime"
version = "0.1.0"
edition = "2021"
description = "Residual VM kernel for the Quench program reducer"
license = "MIT"

[features]
execution-trace = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
icu_collator = { version = "2.3", features = ["compiled_data"] }
icu_locale_core = "2.3"
icu_provider = "2.3"
num-bigint = "0.4"
oxc = { version = "0.47", features = ["semantic"] }
regress = { version = "0.12", features = ["utf16"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
