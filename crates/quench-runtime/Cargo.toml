[package]
name = "quench-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "JavaScript and WebAssembly execution runtime for Quench"

[lib]
# No doctests: rustdoc would otherwise compile the crate once more for each `cargo test`.
doctest = false
name = "quench_runtime"

[[bin]]
name = "quench"
path = "src/bin/quench.rs"

[features]
default = []
profile-aggregate = []
profile-trace = ["profile-aggregate"]
profile-memory = []
profile-allocator = []
profile-gc-time = []
# Counts, by opcode, the instructions the lane leaves to the general loop; reported at exit.
profile-lane-exits = []
# Reads the collection pacing knobs from the environment (measurement builds only).
gc-tuning = []
reference = []
# Recompiles each replayable function after its program loads and logs any difference
# (`QUENCH_REPLAY_LOG`); verification builds only.
verify-replay = []

[dependencies]
quench-stack = { path = "../quench-stack" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
oxc_diagnostics = { workspace = true }
rustc-hash = "2.1"
# Line terminators are found by a vectorized byte search (`bytecode::source_line_starts`).
memchr = "2"
# Number::toString takes the shortest round-trip digits from Ryu (`number_to_string`).
ryu = "1"
itoa = "1"
# The shape transition index keeps only child ids (`vm::shape_transitions`).
# Default features and `raw-entry` match what quench-node enables (feature pins below).
hashbrown = { version = "0.16", features = ["raw-entry"] }
rayon = "1.12.0"
smallvec = "1.15.2"
num-bigint = "0.4"
num-traits = "0.2"
quench-regexp = { path = "../quench-regexp" }
quench-intl = { path = "../quench-intl" }
quench-temporal = { path = "../quench-temporal" }
wasmparser = "0.247"
# The compiled execution mode: Cranelift is the code generator the generating
# extension emits into; libc maps the resulting code executable.
cranelift-codegen = { version = "=0.134.3", default-features = false, features = ["std", "host-arch"] }
cranelift-frontend = { version = "=0.134.3", default-features = false, features = ["std"] }
cranelift-native = { version = "=0.134.3", default-features = false }
libc = "0.2"
# fdlibm atan is part of the shared binary64 Math rounding policy.
libm = "=0.2.16"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
# Feature pins, not used here. quench-node's dependencies (oxc_resolver, openssl, tracing)
# enable more features on crates this one shares. Cargo resolves features per selected
# package, so without these `-p quench-runtime` and `-p quench-node` built oxc, cranelift and
# this crate twice under different hashes. `cargo tree -e features` on both selections must
# list the same features for this crate's dependencies.
serde = { version = "1", features = ["derive"] }
indexmap = "2"
bitflags = { version = "2", features = ["std"] }
foldhash = "0.2"
utf8_iter = "1"

[build-dependencies]
# Feature pin, not used by build.rs: quench-node's proc-macros enable syn "visit-mut", and
# syn is shared with oxc's proc-macros (see the feature pins above).
syn = { version = "2", features = ["full", "visit-mut"] }
# Feature pin, not used by build.rs: quench-node's syntax-check proc-macro builds oxc for the
# host with phf "macros", which oxc's own proc-macros share.
phf = { version = "0.14", features = ["macros"] }

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
