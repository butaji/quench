[package]
name = "quench-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "JavaScript and WebAssembly execution runtime for Quench"

[lib]
name = "quench_runtime"

[[bin]]
name = "quench"
path = "src/bin/quench.rs"

[features]
default = []
profile-aggregate = []
profile-trace = ["profile-aggregate"]
profile-memory = []
reference = []

[dependencies]
quench-stack = { path = "../quench-stack" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
rustc-hash = "2.1"
num-bigint = "0.4"
quench-regexp = { path = "../quench-regexp" }
quench-intl = { path = "../quench-intl" }
quench-temporal = { path = "../quench-temporal" }
wasmparser = "0.247"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"

[dev-dependencies]
