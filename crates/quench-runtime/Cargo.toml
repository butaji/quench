[package]
name = "quench-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "JavaScript and WebAssembly execution runtime for Quench"

[lib]
# No doctests: rustdoc would otherwise compile the crate once more for each `cargo test`.
doctest = false
name = "quench_runtime"

[[bench]]
name = "number_primitives"
required-features = ["bench-primitives"]

[features]
default = ["jit", "native-execution", "source", "intl", "tzdb", "wasm"]
# The front end: parsing and compiling JS/TS source (`Engine::specialize*`). A static image's support
# build leaves it out, so no parser or compiler is linked; source compilation then refuses.
source = []
jit = []
native-execution = []
# Intl and Temporal: the runtime core's `Collation` and locale case mapping, and the
# `quench-runtime-intl` layer the facade links. Implies `tzdb` (Intl formats zoned dates).
intl = ["tzdb", "dep:quench-intl"]
# The IANA time zone database (`chrono-tz`), read for the local zone and `timeZone` options.
tzdb = ["dep:chrono-tz"]
# The WebAssembly frontend in the interpreter and the staged rows (`wasmparser`).
wasm = []
# What quench-runtime-engine's own tests reach of the core: `test_support` and the test-only
# counters (the core's `cfg(test)` items, which a dependent crate's tests do not see).
test-support = []
# Compatibility alias: AOT code is always compiled, so this feature is a no-op.
aot = []
profile-aggregate = []
# Successful field helper counts without changing lane admission or array proofs.
profile-field-primitives = []
profile-trace = ["profile-aggregate"]
profile-memory = []
profile-native-ops = ["native-execution"]
profile-allocator = []
profile-gc-time = []
# Counts, by opcode, the instructions the lane leaves to the general loop; reported at exit.
profile-lane-exits = []
reference = []
# Test-only measurements of shared primitives; workflow and evidence: Linear TOD-9.
bench-primitives = []
# Opt-in allocator routing for direct backing-growth measurements only.
bench-alloc-routes = ["bench-primitives"]
# Recompiles each replayable function after its program loads and logs any difference
# (`QUENCH_TRACE=replay=<path>`); verification builds only.
verify-replay = []
# Every tier threshold at its floor, so short programs (Test262) run compiled code; the
# results must equal the interpreter's. Verification builds only.

[dependencies]
quench-alloc = { path = "../quench-alloc" }
object = { version = "=0.39.1", default-features = false, features = ["read_core", "elf", "macho", "std"] }
serde_json = "1"
quench-macros = { path = "../quench-macros" }
# The opcode table: `bytecode.rs` expands its rows into `Op` (`with_opcode_table!`).
quench-opcodes = { path = "../quench-opcodes" }
quench-stack = { path = "../quench-stack" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", optional = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
oxc_diagnostics = { workspace = true }
rustc-hash = "2.1"
# Line terminators are found by a vectorized byte search (`bytecode::source_line_starts`).
memchr = "2"
# Number::toString takes the shortest round-trip digits from Ryu (`number_to_string`).
ryu = "1"
itoa = "1"
# The shape transition index keeps only child ids (`vm::shape_transitions`).
# Default features and `raw-entry` match what quench enables (feature pins below).
hashbrown = { version = "0.16", features = ["raw-entry"] }
rayon = "1.12.0"
smallvec = { version = "1.15.2", features = ["const_generics"] }
num-bigint = "0.4"
num-traits = "0.2"
quench-regexp = { path = "../quench-regexp" }
quench-bjit = { path = "../quench-bjit" }
quench-intl = { path = "../quench-intl", optional = true }
quench-temporal = { path = "../quench-temporal" }
wasmparser = "0.247"
# The compiled execution mode: Cranelift is the code generator the generating
# extension emits into; libc maps the resulting code executable.
cranelift-codegen = { version = "=0.137.1", default-features = false, features = ["std", "host-arch", "x86", "arm64"] }
cranelift-frontend = { version = "=0.137.1", default-features = false, features = ["std"] }
cranelift-native = { version = "=0.137.1", default-features = false }
cranelift-object = { version = "=0.137.1", default-features = false }
cranelift-module = { version = "=0.137.1", default-features = false, features = ["std"] }
# Target triples of AOT images: the object format (ELF, Mach-O, COFF) follows the triple.
target-lexicon = "0.13.5"
libc = "0.2"
# fdlibm atan is part of the shared binary64 Math rounding policy.
libm = "=0.2.16"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
# Feature pins, not used here. quench's dependencies (oxc_resolver, openssl, tracing)
# enable more features on crates this one shares. Cargo resolves features per selected
# package, so without these `-p quench-runtime` and `-p quench` built oxc, cranelift and
# this crate twice under different hashes. `cargo tree -e features` on both selections must
# list the same features for this crate's dependencies.
serde = { version = "1", features = ["derive"] }
indexmap = "2"
bitflags = { version = "2", features = ["std"] }
foldhash = "0.2"
utf8_iter = "1"

[build-dependencies]
# Feature pin, not used by build.rs: quench's proc-macros enable syn "visit-mut", and
# syn is shared with oxc's proc-macros (see the feature pins above).
syn = { version = "2", features = ["full", "visit-mut"] }
# Feature pin, not used by build.rs: quench's syntax-check proc-macro builds oxc for the
# host with phf "macros", which oxc's own proc-macros share.
phf = { version = "0.14", features = ["macros"] }

[dev-dependencies]
quench-tier-corpus = { path = "../quench-tier-corpus" }
# Links the layer crates into the integration tests and examples (`extern crate quench_layers`).
quench-layers = { path = "../quench-layers" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "native_publication"
required-features = ["jit"]

[lints]
workspace = true

[[example]]
name = "ts_corpus"
