[package]
name = "quench-runtime-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "The Quench runtime's lane handlers and compiled tiers: a layer crate above the VM core"

[lib]
doctest = false

[features]
# Never enabled here: quench-runtime files this crate mounts name quench-runtime's feature of that name.
test-support = ["intl", "tzdb", "wasm"]
default = ["jit", "native-execution", "intl", "tzdb", "wasm"]
# The same features as quench-runtime's, which quench-layers enables together with the core's.
jit = ["quench-runtime/jit"]
intl = ["quench-runtime/intl"]
tzdb = ["quench-runtime/tzdb"]
wasm = ["quench-runtime/wasm"]
native-execution = ["quench-runtime/native-execution"]
profile-field-primitives = ["quench-runtime/profile-field-primitives"]
profile-lane-exits = ["quench-runtime/profile-lane-exits"]
profile-native-ops = ["quench-runtime/profile-native-ops"]
profile-aggregate = ["quench-runtime/profile-aggregate"]
profile-trace = ["quench-runtime/profile-trace"]
profile-memory = ["quench-runtime/profile-memory"]
profile-gc-time = ["quench-runtime/profile-gc-time"]
aot = ["quench-runtime/aot"]
profile-allocator = ["quench-runtime/profile-allocator"]
reference = ["quench-runtime/reference"]
bench-primitives = ["quench-runtime/bench-primitives"]
bench-alloc-routes = ["bench-primitives", "quench-runtime/bench-alloc-routes"]
verify-replay = ["quench-runtime/verify-replay"]
tier-stress = ["quench-runtime/tier-stress"]

[dependencies]
quench-runtime = { path = "../quench-runtime", default-features = false }
quench-macros = { path = "../quench-macros" }
quench-bjit = { path = "../quench-bjit" }
quench-alloc = { path = "../quench-alloc" }
quench-stack = { path = "../quench-stack" }
oxc_ast = { workspace = true }
smallvec = { version = "1.15.2", features = ["const_generics"] }
rustc-hash = "2.1"
object = { version = "=0.39.1", default-features = false, features = ["read_core", "elf", "macho", "std"] }
wasmparser = "0.247"
cranelift-codegen = { version = "=0.137.1", default-features = false, features = ["std", "host-arch", "x86", "arm64"] }
cranelift-frontend = { version = "=0.137.1", default-features = false, features = ["std"] }
cranelift-native = { version = "=0.137.1", default-features = false }
cranelift-object = { version = "=0.137.1", default-features = false }
cranelift-module = { version = "=0.137.1", default-features = false, features = ["std"] }
quench-regexp = { path = "../quench-regexp" }
target-lexicon = "0.13.5"
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
# The intl layer's exported entry points, which the core names and a test binary must link.
quench-runtime-intl = { path = "../quench-runtime-intl" }
# The stencil tables `quench_bjit::rustc` reads (QUENCH_STENCILS_*), which a test binary must link.
quench-stencils = { path = "../quench-stencils" }
quench-tier-corpus = { path = "../quench-tier-corpus" }
quench-runtime = { path = "../quench-runtime", default-features = false, features = ["test-support", "source"] }
# The static Ir predictor (`emit/ir_predict_tests.rs`, S1.12) decodes each row's compiled code to count its fast
# path; the version and features quench-bjit locks, so Cargo.lock already has it.
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "instr_info"] }
