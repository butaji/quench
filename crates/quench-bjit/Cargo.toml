[package]
name = "quench-bjit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "BaseJIT: rustc-built stencils copied and patched at run time"

# The stencil build script is quench-stencils' (`build = "../quench-bjit/build.rs"`), which compiles every row; this
# package has none, so the runtime crates that depend on it alone do not wait on the stencils.
build = false

[lib]
doctest = false

[dependencies]
# The staged handler language. The stencil build compiles its sources; the library re-exports them after the move.
quench-staged = { path = "../quench-staged" }

[features]
# Named so the runtime sources the stencil build includes may gate test-only items on it.
test-support = []

[lints]
workspace = true

[dev-dependencies]
libc = "0.2"
# The stencil tables the library tests read (`rustc::stencil`).
quench-stencils = { path = "../quench-stencils" }
# The build's layout tests (`build/layout.rs`) run in the lib's test binary.
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "block_encoder", "instr_info"] }
