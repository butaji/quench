[package]
name = "quench-intl"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared engine-independent internationalization algorithms for Quench"

[dependencies]
chrono-tz = "0.10"
fixed_decimal = "0.7.2"
icu_calendar = { version = "2.3", features = ["compiled_data"] }
icu_collator = { version = "2.3", features = ["compiled_data"] }
icu_plurals = { version = "2.3", features = ["compiled_data", "unstable"] }
icu_locale_core = "2.3"
icu_provider = "2.3"
quench-temporal = { path = "../quench-temporal" }
unicode-normalization = "0.1"
