[package]
name = "quench-staged"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The staged handler language: the rows the BaseJIT stencils and the runtime compile from one source"

[lib]
# No doctests: rustdoc would otherwise compile the crate once more for each `cargo test`.
doctest = false

[features]
# The per-operation profile counters, forwarded by quench-runtime's feature of the same name.
profile-aggregate = []
# Test-only items that quench-runtime's tests call (enabled by its dev-dependency); no shipped code reads it.
test-support = []

[dependencies]
# Used by the cargo flavor only: the stencil build compiles this crate's sources with rustc directly.
libm = "=0.2.16"
# The WebAssembly frontend (`from_wasm`), cargo flavor only, as in quench-runtime.
wasmparser = "0.247"

[lints]
workspace = true
