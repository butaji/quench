[package]
name = "quench-layers"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Links the Quench runtime's layer crates with its VM core"

[lib]
doctest = false

[[bin]]
name = "quench-runtime"
path = "src/bin/quench-runtime.rs"

[dependencies]
quench-runtime = { path = "../quench-runtime" }
quench-runtime-intl = { path = "../quench-runtime-intl" }
quench-runtime-engine = { path = "../quench-runtime-engine" }

[lints]
workspace = true
