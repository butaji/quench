[package]
name = "quench-js-check"
version = "0.1.0"
edition = "2021"
description = "Compile-time syntax validation for embedded JavaScript strings"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
syn = "2"
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true, features = ["regular_expression"] }
oxc_span = { workspace = true }
