[package]
name = "quench-fastjit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "FastJIT: Cranelift-built stencils copied and patched at run time"

[lib]
doctest = false

[dependencies]
cranelift-codegen = { version = "=0.134.3", default-features = false, features = ["std"] }
cranelift-frontend = { version = "=0.134.3", default-features = false, features = ["std"] }
cranelift-native = { version = "=0.134.3", default-features = false }

[lints]
workspace = true

[dev-dependencies]
libc = "0.2"
