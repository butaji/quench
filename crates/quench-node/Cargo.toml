[package]
name = "quench-node"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "quench-node"
path = "src/bin/quench-node.rs"

[dependencies]
quench-js-check = { path = "../quench-js-check" }
quench-runtime = { path = "../quench-runtime" }
serde_json = "1"
regex = "1.11"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"
sysinfo = "0.32"
openssl = "0.10"
oxc_resolver = "2"
url = "2"
brotli = "7"
encoding_rs = "0.8"
flate2 = { version = "1", features = ["zlib-rs"] }
idna = "1"
libc = "0.2"
zstd = "0.13"
