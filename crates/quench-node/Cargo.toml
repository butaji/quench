[package]
name = "quench-node"
version = "0.1.0"
edition = "2021"
description = "Node-compatible JavaScript runtime built on rquickjs"
license = "MIT"

[dependencies]
quench-js-check = { path = "../quench-js-check" }
quench-runtime = { path = "../../quench-runtime/crates/quench-runtime" }
rquickjs = { version = "0.9", features = ["array-buffer", "classes", "futures", "loader", "macro", "properties", "parallel"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"
sha3 = "0.10"
rand = "0.8"
libc = "0.2"
hostname = "0.4"
flate2 = "1"
url = "2"
oxc_resolver = "2"
