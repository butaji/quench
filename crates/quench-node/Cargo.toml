[package]
name = "quench-node"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
# No doctests: rustdoc would otherwise compile the crate once more for each `cargo test`.
doctest = false

[[bin]]
name = "quench-node"
path = "src/bin/quench-node.rs"

[features]
# quench-alloc stays opt-in on the RSS lane (v2-cloud-c2): linked by default it raised V8-v7
# max RSS (static x86_64, unbolted, 2026-10-18, KiB): Crypto 4272 -> 4640, Richards 3716 ->
# 4064, RayTrace 3884 -> 4128, DeltaBlue 3840 -> 4120, RegExp 7612 -> 7980. The Score lane
# (v2-cloud-c) and the npm lane (v2-npm) link it by default: on npm scenarios it left peak
# RSS unchanged and cut wall time 4-15% (x86_64 Linux VM, 4 cores, 2026-10-20: ms 105 -> 99
# ms, chalk 125 -> 107, typescript 576 -> 505; harness imports 238M -> 229M instructions).
# The JetStream lane (v2-cloud-jet) links it by default too (x86_64 Linux, 4 vCPU,
# 2026-10-21, Score glibc -> quench-alloc): bigint-noble-ed25519 4.71 -> 8.79, UniPoker 16.1 ->
# 19.2, typescript-lib 0.15 -> 0.19, stanford-crypto-aes 26.1 -> 28.8, hash-map 16.3 -> 17.1;
# max RSS within 1 MB but aes 32.3 -> 34.4 MB, all below Bun's except where already above.
# Re-measured after trunk had dropped it (2026-10-23, median of 3, Score glibc -> quench-alloc,
# max RSS KiB): bigint-noble-ed25519 8.28 -> 13.87 (34256 -> 32104), json-parse-inspector
# 109.8 -> 133.1, babel-wtb 8.56 -> 9.42, stanford-crypto-aes 26.9 -> 28.1 (31880 -> 37256),
# UniPoker 23.3 -> 24.4, hash-map 23.5 -> 23.5, doxbee-async 37.3 -> 35.5 (41176 -> 43832).
default = ["quench-alloc"]
profile-memory = ["quench-runtime/profile-memory"]
verify-replay = ["quench-runtime/verify-replay"]
# Quench's size-classed small-object allocator as the global allocator (TOD-137).
quench-alloc = ["dep:quench-alloc"]
profile-allocator = ["quench-runtime/profile-allocator"]

[dependencies]
quench-js-check = { path = "../quench-js-check" }
quench-runtime = { path = "../quench-runtime" }
quench-wasm = { path = "../quench-wasm" }
serde_json = "1"
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl", "perf-literal", "perf-onepass", "perf-backtrack"] }
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"
memchr = "2"
rustc-hash = "2.1"
foldhash = "0.2"
sysinfo = "0.32"
openssl = "0.10"
openssl-sys = "0.9"
foreign-types = "0.3"
oxc_resolver = "11"
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
quench-stack = { path = "../quench-stack" }
quench-alloc = { path = "../quench-alloc", optional = true }
url = { version = "2", features = ["expose_internals"] }
brotli = "7"
encoding_rs = "0.8"
crc32fast = "1"
idna = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
zstd = { version = "0.13", features = ["zstdmt"] }
libz-rs-sys = "0.6.8"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
