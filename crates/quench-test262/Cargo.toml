[package]
name = "quench-test262"
version = "0.1.0"
edition = "2021"
description = "ECMA-262 test262 runner for a host JavaScript engine"
license = "MIT"

[lib]
# No doctests: rustdoc would otherwise compile the crate once more for each `cargo test`.
doctest = false

[features]
default = ["jit"]
jit = ["quench-runtime/jit"]
native-execution = ["quench-runtime/native-execution"]
aot = ["quench-runtime/aot"]
profile-aggregate = ["quench-runtime/profile-aggregate"]
profile-memory = ["quench-runtime/profile-memory"]
verify-replay = ["quench-runtime/verify-replay"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dependencies]
libc = "0.2"
oxc_syntax.workspace = true
quench-runtime = { path = "../quench-runtime", default-features = false, features = ["native-execution"] }
serde_json = "1"
wait-timeout = "0.2.1"

[[bin]]
name = "emit-native"
path = "src/bin/emit-native.rs"
required-features = ["aot"]
