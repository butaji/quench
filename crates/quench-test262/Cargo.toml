[package]
name = "quench-test262"
version = "0.1.0"
edition = "2021"
description = "ECMA-262 test262 runner for a host JavaScript engine"
license = "MIT"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dependencies]
quench-runtime = { path = "../quench-runtime" }
serde_json = "1"
