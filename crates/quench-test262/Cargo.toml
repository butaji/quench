[package]
name = "quench-test262"
version = "0.1.0"
edition = "2021"
description = "ECMA-262 test262 runner for a host JavaScript engine"
license = "MIT"

[lib]
# No doctests: rustdoc would otherwise compile the crate once more for each `cargo test`.
doctest = false

[features]
default = ["jit"]
jit = ["quench-runtime/jit", "quench-layers/jit"]
native-execution = ["quench-runtime/native-execution", "quench-layers/native-execution"]
# One host ABI per native SDK; regular multi-host builds keep exports in drivers.
native-sdk = ["native-execution"]
# Compatibility alias: AOT code is always compiled, so this feature is a no-op.
aot = []
profile-aggregate = ["quench-runtime/profile-aggregate", "quench-layers/profile-aggregate"]
profile-memory = ["quench-runtime/profile-memory", "quench-layers/profile-memory"]
verify-replay = ["quench-runtime/verify-replay", "quench-layers/verify-replay"]
tier-stress = ["quench-runtime/tier-stress", "quench-layers/tier-stress"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dependencies]
libc = "0.2"
oxc_syntax.workspace = true
quench-runtime = { path = "../quench-runtime", default-features = false, features = ["native-execution"] }
quench-layers = { path = "../quench-layers", default-features = false, features = ["native-execution"] }
serde_json = "1"
wait-timeout = "0.2.1"

[[bin]]
name = "emit-native"
path = "src/bin/emit-native.rs"

[lints]
workspace = true
