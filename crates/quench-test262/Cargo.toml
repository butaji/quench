[package]
name = "quench-test262"
version = "0.1.0"
edition = "2021"
description = "Test262 harness and conformance runner for Quench"
license = "MIT"

[dependencies]
quench-runtime = { path = "../quench-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
