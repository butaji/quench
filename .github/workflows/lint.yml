name: lint

on:
  push:
  pull_request:

jobs:
  source-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --ignore-scripts
      - run: tools/lint-all.sh
